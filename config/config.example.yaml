listen_host: 0.0.0.0
listen_port: 7284
# Mandatory allowlist: empty = every target is rejected.
# Set it to the authorised lab network(s).
allow_networks:
  - 0.0.0.0/0
cache_ttl_s: 86400
# Scans Claude may run at the same time (MCP runs them in the background).
max_active_scans: 10
# Built-in profiles and policies (read-only).
policies_dir: config/policies
profiles_dir: config/profiles
# Where the profiles and policies engineers upload are stored, shared by everyone.
# Under systemd it defaults to /var/lib/ssh-auditor (StateDirectory); empty = no uploads.
# custom_dir: data
