nombre: base
kex:
  prohibidos:
    - diffie-hellman-group1-sha1
    - diffie-hellman-group14-sha1
    - diffie-hellman-group-exchange-sha1
  requerido_pq: mlkem768x25519-sha256   # su ausencia produce WARN
cifrados:
  prohibidos:
    - 3des-cbc
    - aes128-cbc
    - aes192-cbc
    - aes256-cbc
    - blowfish-cbc
    - cast128-cbc
    - arcfour
    - arcfour128
    - arcfour256
macs:
  prohibidos:
    - hmac-md5
    - hmac-md5-96
    - hmac-md5-etm@openssh.com
    - hmac-md5-96-etm@openssh.com
    - hmac-sha1
    - hmac-sha1-96
    - hmac-sha1-etm@openssh.com
    - hmac-sha1-96-etm@openssh.com
host_key:
  prohibidos:
    - ssh-rsa
    - ssh-dss
    - ssh-rsa-cert-v01@openssh.com
    - ssh-dss-cert-v01@openssh.com
