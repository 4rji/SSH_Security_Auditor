id: base
name: Base
description: Forbids legacy SSH algorithms (SHA-1 key exchange, CBC/RC4 ciphers, MD5/SHA-1 MACs, DSA and SHA-1 RSA host keys).
kex:
  forbidden:
    - diffie-hellman-group1-sha1
    - diffie-hellman-group14-sha1
    - diffie-hellman-group-exchange-sha1
ciphers:
  forbidden:
    - 3des-cbc
    - aes128-cbc
    - aes192-cbc
    - aes256-cbc
    - blowfish-cbc
    - cast128-cbc
    - arcfour
    - arcfour128
    - arcfour256
macs:
  forbidden:
    - hmac-md5
    - hmac-md5-96
    - hmac-md5-etm@openssh.com
    - hmac-md5-96-etm@openssh.com
    - hmac-sha1
    - hmac-sha1-96
    - hmac-sha1-etm@openssh.com
    - hmac-sha1-96-etm@openssh.com
host_key:
  forbidden:
    - ssh-rsa
    - ssh-dss
    - ssh-rsa-cert-v01@openssh.com
    - ssh-dss-cert-v01@openssh.com
sshd:
  expected:
    passwordauthentication: "no"
    pubkeyauthentication: "yes"
    kbdinteractiveauthentication: "no"
    permitrootlogin: "no"
    maxauthtries: 3
  contexts:
    - name: root
      user: root
      # Synthetic client origin used to apply Match blocks.
      host: localhost
      addr: 127.0.0.1
      expected:
        permitrootlogin: "no"
