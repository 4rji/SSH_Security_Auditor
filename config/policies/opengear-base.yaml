nombre: opengear-base
kex:
  prohibidos:
    - diffie-hellman-group1-sha1
    - diffie-hellman-group14-sha1
  requerido_pq: mlkem768x25519-sha256   # su ausencia produce WARN
cifrados:
  prohibidos:
    - 3des-cbc
    - aes128-cbc
    - aes192-cbc
    - aes256-cbc
host_key:
  prohibidos:
    - ssh-rsa
    - ssh-dss
